#*****************************************************************
# Neo4j configuration for HTTPS
# Based on reference template: https://github.com/sukrutnrvd/neo4j-template
#*****************************************************************

# Server configuration
server.default_listen_address=0.0.0.0
server.directories.logs=/logs

# Bolt connector
server.bolt.enabled=true
server.bolt.listen_address=:7687

# HTTP Connector - enabled for UI compatibility
server.http.enabled=true
server.http.listen_address=:7474

# HTTPS Connector - enabled for secure access
server.https.enabled=true
server.https.listen_address=:7473

# SSL policy configuration for HTTPS
dbms.ssl.policy.https.enabled=true
dbms.ssl.policy.https.base_directory=certificates/https
dbms.ssl.policy.https.private_key=private.key
dbms.ssl.policy.https.public_certificate=public.crt
dbms.ssl.policy.https.client_auth=NONE

# Authentication
dbms.security.auth_enabled=true

# Memory settings (adjust based on your system)
server.memory.heap.initial_size=512m
server.memory.heap.max_size=2G
server.memory.pagecache.size=1G

# Transaction log retention
db.tx_log.rotation.retention_policy=2 days 2G
